# Windows gameplay appearance on Mac, based on Mac beta 0.19.
# Your controls: V zoom, R hide players, hold C history; F5 reload.
# Rebind in StarBreak Settings > Controls > SBPE; saved overrides use [sbpe_controls].
# Cathedral route map and custom tools are excluded.

[general]
game = auto
flags = None
mipmaps = no
mipmap_maxlevel = 2
# keep the command line window open
keep_open = no
# Reopen after an abnormal exit; normal Quit and Ctrl-C stop the game.
auto_restart = yes

[manager]
# time in seconds between live reload checks
period = 3
# which plugins should go first during callbacks
priority = zoom noise keybinds fps extra_info map playerlist

[plugin_zoom]
fast = yes
# internal draw width; negative values mean 1:1 scale
level = -1
# transition time in seconds, 0 = instant
time = 0.1

[plugin_map_timers2]
show_count_up = no
show_count_down = yes
color_count_down = ffffff
size_count_down = 16
anchor_y_count_down = -1
anchor_x_count_down = 0
offset_y_count_down = 0
offset_x_count_down = 0
font_count_down = TenbyFive

[plugin_misc]
# use borderless windowed mode, with pre-defined location and size
fixed_window = no
# window coordinates (to position on different displays, consult remote.log for corner coordinates)
window_x = 0
window_y = 0
window_width = 1920
window_height = 1080
# centered camera: 0 = disabled, 1 = centered and inbounds, 2 = always centered
centered = 1
# if background color is brighter than this value, it is reduced to match
# useful when drawUniform = no
max_bg_value = 1
# in seconds
hide_cursor_after = 2
# these correspond to "admin keys". make your own keybinds if you need
drawHUD = yes
drawTiles = yes
drawEdge = yes
drawScatter = yes
drawUniform = yes
drawHitBoxes = no
drawBoxes = no

[plugin_squid_prediction]
# --- v3.0+ configs ---
enable = yes
# show number of living squids
squid_count_alive_show = yes
# show total number of squids
squid_count_total_show = yes
# hide green squids since they are not necessary
hide_green_squids = yes
# show prediction box
box_show = yes
# show an outline around box
box_outline_show = yes
# show countdown until squid is active
number_show = yes
# fade box color between two values (values defined below)
color_fade = yes
# --- box opts ---
# box color when not using fading
box_default_color = ff7f00
# color the box starts as when fading
box_fade_start_color = ffff00
# color the box becomes when fading
box_fade_end_color = ff0000
box_transparency = 0.6
# --- box outline opts ---
box_outline_color = ff0000
box_outline_transparency = 1
box_outline_thickness = 2
# --- countdown number opts ---
number_size = 16
number_outline_size = 2
number_color = ffc300
number_outline_color = 00
# --- squid count opts ---
squid_count_alive_size = 16
squid_count_total_size = 12
squid_count_x = 400
squid_count_y = 200

[plugin_fps]
size = 16
color = ff0
# time between updates in seconds
update = 0.5
# sliding window size, in seconds
average = 1
# time reserve indicator (~= network/server lag)
res_size = 14
res_color = fff
res_warning = f00

[plugin_hud]
# coordinates of the top-mid point between hp and hpmax
x = 120
y = 50
# spacing added between lines
spacing = -20
# font sizes
size_hp = 75
size_hpmax = 50
size_ammo = 32
size_ammomax = 24
size_currency = 12
# colors
color_hp = fff
color_hp_full = 9f9
color_ammo = ffb
color_currency = fff
# outline size
outline = 3
# health bar size in pixels
bar_width = 0
bar_height = 0
# vertical offset from top of the shell
bar_y = 10
# health bar colors
bar_background = 000000
bar_outline = 808080
bar_color = 0afde1
bar_notches = ffffff

[plugin_map]
visible = no
# auto-hide if a room is smaller in both dimensions than what is visible times this value (set to 0 to disable)
small_room = 0
# position anchor point (0..1, 0 = top/left, 1 = bottom/right)
px = 0.5
py = 0.5
# maximum part of the screen occupied by the map
w = 0.9
h = 0.9
# hide in lobby and bosses? pretty crude
hide_outside_zones = no
# element colors
bg = 90000000
platform = fff
ledge = aaa
enemy = f00
enemy_harmless = f80
player = ff0
player_self = 0f0
interact = 0ff
trigger = f0f
item = 0
chest = 08f

[plugin_extra_info]
# trigger zones
trigger_color = 80ff00ff
trigger_frame = 3
# object health/armor
show_hp = no
# portal player counts, key counts
show_uses = yes
# display zone name and floor number in bottom right corner
show_room_id = yes
# enabled types of arrows
arrows = door shop secret arcade hp boost player
# default arrow color
arrows_color = fff
# arrow size (in pixels)
arrows_length = 30
arrows_width = 20
arrows_outline = 2
# border width of visible target objects
arrows_frame = 5
# distance when visuals start to fade out
arrows_fade = 500
# blink period in seconds (0 to disable)
arrows_blink = 0
# you can set any of the above options for different types separately
arrow_door_color = ff0
arrow_shop_color = 08f
arrow_shop_blink = 0.3
arrow_shop_length = 75
arrow_shop_width = 20
arrow_secret_color = 00f
arrow_secret_blink = 0.3
arrow_secret_length = 75
arrow_secret_width = 20
arrow_arcade_color = f80
arrow_arcade_blink = 0.6
arrow_arcade_length = 75
arrow_arcade_width = 20
arrow_hp_color = 0f0
arrow_hp_frame = 99
arrow_hp_blink = 0.3
arrow_boost_color = 8f0
arrow_boost_frame = 99
arrow_player_color = 0f0
arrow_player_frame = 0
arrow_player_width = 7
arrow_player_length = 6

[plugin_noise]
damage_flash_intensity = 0.2
# other player shells
hide_shells = no
# other player info
hide_names = no
hide_factions = yes
hide_healthbars = no
# objects created by other players (except for macrons)
hide_ally_objects = no
# damage effects, death animations, particle trails
hide_effects = yes
# replace screen shake and flash effects with an indicator
replace_shake = yes
# hide chat
hide_chat = no
# extra effects like fake vq mid bullets
; hide_extras = yes

[plugin_playerlist]
visible = no
# font size
size = 14

[plugin_highlight_player3]
# --- b3.1+ configs ---
# --- Hiding Options ---
hide_players = no
whitelist_players = yes
whitelist_factions = yes
# --- Highlight Options ---
highlight_players = yes
highlight_faction = yes
# highlights both the name and faction of a player even when only one is in the notable list, (recommended yes)
highlight_both = yes
# name highlight settings
player_size = 16
player_outline_size = 2
player_color = 2cff80
player_font = TenbyFive
# faction highlight settings
faction_size = 14
faction_outline_size = 2
faction_color = 00ff00
faction_font = TenbyFive
# highlight settings used when `highlight_both` is enabled
alternate_player_size = 14
alternate_player_outline_size = 2
alternate_player_color = 2cff80
alternate_player_font = TenbyFive
alternate_faction_size = 10
alternate_faction_outline_size = 2
alternate_faction_color = 1c74cb
alternate_faction_font = TenbyFive
# --- Additional Options ---
# (0, 0) is the bottom middle of the hitbox
x_offset = 0
y_offset = -30
; faction_y_offset = 0
# whether to let faction names go out of bounds or not
out_of_bounds_faction_name = yes
# changes how highlights are dealt with when overlapping with the chat box
# 0 is none, nothing changes
# 1: sets highlight opacity to chat_alpha
# 2: snaps highlight to the outside of the chat box
# 3: dynamically switches between 1 and 2; 1 when the player is onscreen, 2 when the player is offscreen
# (recommended 3)
chat_behavior = 3
chat_alpha = 0.5

[plugin_keybinds]
# format: PLUGIN OPTION TYPE VALUE [VALUE ...] = KEY
# types:
#   set = set to value when pressed
#   hold = set to first value when pressed, to second when released
#   toggle = cycle through values on each press


map visible hold yes no = Right Shift

	#Zoom out&in
zoom level toggle 2000 2400 = V
zoom level toggle 6000 = t

	#Hide chat
noise hide_chat toggle yes no	= .

	
	#Monsters hp
extra_info show_hp toggle yes no = '


	#Hiding all shells
noise hide_names toggle yes no = R
noise hide_healthbars toggle yes no = R
noise hide_ally_objects toggle yes no = R
highlight_player3 hide_players toggle yes no = R



misc centered toggle 1 2 = l


playerlist visible hold yes no = C


# show information about triggered keybinds in top left corner, useful for debugging
info_time = 0
[native]
# Reject implausible network frames and failed world parses; restart to apply.
network_length_guard = yes
network_delta_guard = yes
# Robust native framing: partial headers/reads, interruptions and socket changes.
network_stream_receiver = no
# Encrypted route disabled: live login framing validation failed.
network_websocket_transport = no
# Read-only r=0 / server-time / frame-gap and TCP-counter correlation.
network_health_diagnostics = yes
# Recover an already-spawned client after sustained r=0/no world progress.
# Active holds, arming and unspawned loading are excluded. Restart to install.
network_stall_recovery = yes
network_stall_seconds = 5
network_max_message_mb = 16
# The Windows-style HUD is always enabled.
# 1 = exact Windows plugin colors, without darkening.
font_brightness = 1
hp_hud = no
hp_bar = no
debug_shortcuts = no
sharp_pixels = yes
# Additional zoomed-out edge contrast: 0 = off, 1 = strongest. Does not alter zoom.
zoom_sharpen = 0.45
# Native UI/equipment use the game's original zoom-based layout.
# Rasterize ordinary names at their zoomed size; values are world font sizes.
readable_names = yes
player_name_size = 14
faction_name_size = 14
# Full Retina backing surface; restart after changing.
retina = yes
hp_show_max = no

[native_highlight]
# Exact lists from your supplied Windows highlighting plugin.
players = 
factions = Sentinel, Starlords, The_Purgatory, Luna, Free

[native_spark_labels]
670488 = EschatonEye

